name: hackathon-bank-poc
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4
    restart: unless-stopped
    environment:
      DOMAIN: https://${POC_IP:?Set POC_IP in .env}:8443
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-true}
      INVITATIONS_ALLOWED: "false"
      ORG_CREATION_USERS: "none"
      EMERGENCY_ACCESS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      DISABLE_ICON_DOWNLOAD: "true"
    volumes:
      - vault_data:/data
    networks:
      - bank

  https:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      POC_IP: ${POC_IP:?Set POC_IP in .env}
    ports:
      - "${POC_IP}:8443:443"
      - "127.0.0.1:8443:443"
      - "${POC_IP}:8081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public-certificates:/public:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bank
    depends_on:
      - vaultwarden

networks:
  bank:

volumes:
  vault_data:
  caddy_data:
  caddy_config:
